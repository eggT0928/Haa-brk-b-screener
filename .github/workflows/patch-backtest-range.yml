name: Apply backtest range enhancement

on:
  push:
    paths:
      - 'scripts/patch_backtest_range.py'
      - '.github/workflows/patch-backtest-range.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply patch
        run: python scripts/patch_backtest_range.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

      - name: Commit patched app
        run: |
          git config user.name "ChatGPT patch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add haa_brk-b_screener_web.py tests/test_momentum.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: extend and customize backtest date range"
            git push
          fi
