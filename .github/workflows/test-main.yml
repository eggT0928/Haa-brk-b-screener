name: Test main

on:
  push:
    branches: [main]
    paths:
      - 'haa_brk-b_screener_web.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test-main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check
        run: python -m py_compile haa_brk-b_screener_web.py

      - name: Run tests
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
        # Firebase 의존성이 없는 기존 앱 전용 검증. 전체 검증은 firebase-ci.yml에서 수행합니다.
        run: pytest -q tests/test_momentum.py
