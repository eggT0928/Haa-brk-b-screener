name: Fix backtest boundaries

on:
  push:
    paths:
      - 'scripts/fix_backtest_boundaries.py'
      - '.github/workflows/fix-backtest-boundaries.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/fix_backtest_boundaries.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q
      - name: Commit fix
        run: |
          git config user.name "ChatGPT patch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add haa_brk-b_screener_web.py tests/test_momentum.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: preserve full selected backtest months"
            git push
          fi
