name: Firebase 웹앱 검증

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            functions/requirements.txt
      - name: 의존성 설치
        run: pip install -r requirements-dev.txt
      - name: 기존 및 신규 계산·API·장애복구 테스트
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
        run: pytest -q
      - name: 백엔드 기본 정적 검사
        run: ruff check functions/haa functions/main.py tests/test_firebase*.py
  web-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: UI 및 수량 계산 테스트
        run: npm test
      - name: 타입 검사 및 프로덕션 빌드
        run: npm run build
      - name: Firestore 실제 에뮬레이터 권한 테스트
        run: npm run test:rules

# 이 워크플로는 검증만 수행한다. Firebase 배포와 main 머지는 수동 승인 후 별도 진행한다.
